<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Đổi ảnh load trận LQM</title>

        <!-- Start: Favicon -->
        <link rel="icon" href="assets/imgs/favicon.ico" type="image/x-icon" />
        <link rel="apple-touch-icon" href="assets/imgs/favicon.ico" />
        <!-- End: Favicon -->

        <meta
            name="description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />

        <!-- Start: Open Graph -->
        <meta property="og:title" content="Đổi ảnh load trận LQM" />
        <meta
            property="og:description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />
        <meta
            property="og:image"
            content="https://aov.honaki.site/assets/imgs/preview.jpg"
        />
        <meta
            property="og:image:secure_url"
            content="https://aov.honaki.site/assets/imgs/preview.jpg"
        />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Đổi ảnh load trận Liên Quân Mobile"
        />
        <meta property="og:url" content="https://aov.honaki.site/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Honaki Poster Studio" />
        <meta property="og:locale" content="vi_VN" />
        <!-- End: Open Graph -->

        <!-- Start: Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Đổi ảnh load trận LQM" />
        <meta
            name="twitter:description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />
        <meta
            name="twitter:image"
            content="https://aov.honaki.site/assets/imgs/preview.jpg"
        />
        <!-- End: Twitter Card -->

        <!-- Màu accent hiển thị ở thanh embed Discord/Telegram và thanh trình duyệt mobile -->
        <meta name="theme-color" content="#005b96" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body>
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box" id="modalBox">
                <button class="modal-close-x" id="modalCloseX">×</button>
                <div class="modal-icon" id="modalIcon"></div>
                <img class="modal-preview-img" id="modalPreviewImg" alt="" />
                <div class="modal-message" id="modalMessage"></div>
                <button class="modal-close-btn" id="modalCloseBtn">Đóng</button>
            </div>
        </div>
        <div class="wrap">
            <div class="grid">
                <!-- LEFT: inputs -->
                <div class="panel">
                    <div class="field">
                        <div class="field-label-row">
                            <label for="playerUrl">Link Poster Nhân Vật</label>
                            <button
                                type="button"
                                class="paste-btn"
                                id="pasteBtn"
                            >
                                Dán
                            </button>
                        </div>
                        <textarea
                            id="playerUrl"
                            rows="3"
                            placeholder="https://kgvn-camp.mobagarena.com/app/player-poster?..."
                        ></textarea>

                        <div class="user-info hidden" id="userInfo">
                            <img
                                alt="Player Image"
                                id="playerImage"
                                class="player-image"
                            />
                            <div style="flex: 1">
                                <p class="player-name" id="playerName"></p>
                                <div class="player-rank-wrap">
                                    <img
                                        alt="Player Rank"
                                        id="playerRank"
                                        class="player-rank"
                                    />
                                    <p
                                        class="player-rank-text"
                                        id="playerRankText"
                                    ></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label>Ảnh Poster Mới</label>
                        <div class="dropzone" id="dropzone">
                            <div>
                                <strong>Chọn ảnh</strong> hoặc kéo thả vào khung
                            </div>
                            <div style="margin-top: 4px; font-size: 11.5px">
                                Định dạng hỗ trợ: JPG · PNG · WEBP
                            </div>
                            <input
                                type="file"
                                id="fileInput"
                                accept="image/jpeg,image/png,image/webp"
                            />
                        </div>
                    </div>

                    <div class="divider"></div>

                    <button class="btn-primary" id="submitBtn" disabled>
                        Đổi Poster Ngay
                    </button>
                    <div style="height: 10px"></div>
                    <button
                        class="btn-ghost hidden"
                        id="resetBtn"
                        style="width: 100%"
                    >
                        Chọn Ảnh Khác
                    </button>
                </div>

                <!-- RIGHT: crop stage -->
                <div class="panel stage-panel">
                    <div class="ratio-badge">Xem Trước Poster</div>
                    <div class="status-line" id="statusLine"></div>

                    <div class="frame-outer">
                        <div class="crop-stage" id="cropStage">
                            <div class="empty-state" id="emptyState">
                                <div class="glyph">✦</div>
                                <div>
                                    Poster của bạn sẽ hiện ở đây<br />kéo &amp;
                                    thu phóng để canh đúng
                                </div>
                            </div>
                            <div class="crop-container" id="cropContainer">
                                <img
                                    id="cropImg"
                                    style="display: none"
                                    alt=""
                                />
                            </div>
                            <div class="crop-overlay"></div>
                        </div>
                    </div>

                    <div class="stage-controls">
                        <div class="zoom-row">
                            <span class="zoom-icon">–</span>
                            <input
                                type="range"
                                id="zoomSlider"
                                min="1"
                                max="4"
                                step="0.01"
                                value="1"
                                disabled
                            />
                            <span class="zoom-icon">+</span>
                        </div>
                        <div class="stage-hint">
                            Kéo để di chuyển · trượt thanh để phóng to / nhỏ
                        </div>
                    </div>
                </div>
            </div>

            <div class="footnote">
                Made by
                <a
                    style="font-weight: 700"
                    target="_blank"
                    href="https://fb.com/honaki10"
                    >Honaki</a
                >
                with <span style="color: red">♥</span>
            </div>
        </div>

        <canvas
            id="hiddenCanvas"
            width="1080"
            height="1701"
            style="display: none"
        ></canvas>

        <script src="assets/js/app.js"></script>
    </body>
</html>
