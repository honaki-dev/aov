<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Đổi ảnh load trận LQM</title>

        <!-- Start: Favicon -->
        <link
            rel="icon"
            href="https://aov.honaki.site/favicon.ico"
            type="image/x-icon"
        />
        <link
            rel="apple-touch-icon"
            href="https://aov.honaki.site/favicon.ico"
        />
        <!-- End: Favicon -->

        <!-- Start: Open Graph -->
        <meta property="og:title" content="Đổi ảnh load trận LQM" />
        <meta
            property="og:description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />
        <meta
            property="og:image"
            content="https://aov.honaki.site/preview.jpg"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:url" content="https://aov.honaki.site/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Honaki Poster Studio" />
        <meta property="og:locale" content="vi_VN" />
        <!-- End: Open Graph -->

        <!-- Start: Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Đổi ảnh load trận LQM" />
        <meta
            name="twitter:description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />
        <meta
            name="twitter:image"
            content="https://aov.honaki.site/preview.jpg"
        />
        <!-- End: Twitter Card -->

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0c0e17;
                --panel: #141726;
                --panel-alt: #1b1f33;
                --line: #2e3350;
                --accent: #f0b93f;
                --accent-bright: #ffd873;
                --accent-warm: #d8453f;
                --text: #f3efe4;
                --muted: #96909e;
                --success: #6fcf97;
                --danger: #e0575a;
                --white: #ffffff;
                --radius: 10px;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                overflow-x: hidden;
            }
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                background:
                    radial-gradient(
                        1200px 600px at 15% -10%,
                        #2c2211 0%,
                        transparent 60%
                    ),
                    radial-gradient(
                        900px 500px at 100% 110%,
                        #2a1216 0%,
                        transparent 55%
                    ),
                    var(--bg);
                color: var(--text);
                font-family:
                    "Manrope",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .wrap {
                max-width: 1120px;
                width: 100%;
                margin: auto;
                padding: 40px 20px;
            }
            .grid {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 22px;
                align-items: stretch;
            }
            .grid .panel {
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            .grid .stage-panel {
                justify-content: center;
            }

            .panel {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                padding: 20px;
            }

            @media (max-width: 860px) {
                .grid {
                    grid-template-columns: 1fr;
                    gap: 18px;
                }
                .wrap {
                    padding: 24px 16px;
                }
            }
            @media (max-width: 400px) {
                .wrap {
                    padding: 18px 12px;
                }
                .panel {
                    padding: 16px;
                }
            }

            .field {
                margin-bottom: 18px;
            }
            .field label {
                display: block;
                font-size: 11.5px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 8px;
            }
            .field textarea {
                width: 100%;
                background: var(--panel-alt);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 10px 12px;
                color: var(--text);
                font-size: 12.5px;
                font-family:
                    "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo,
                    Consolas, monospace;
                line-height: 1.55;
                outline: none;
                resize: none;
                height: 96px;
                overflow-y: auto;
                white-space: pre-wrap;
                overflow-wrap: break-word;
                word-break: break-all;
                transition: border-color 0.15s ease;
            }
            .field textarea:focus {
                border-color: var(--accent);
            }
            .field .hint {
                margin-top: 6px;
                font-size: 11.5px;
                color: var(--muted);
                line-height: 1.5;
            }

            .link-status {
                margin-top: 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .link-chip {
                font-size: 10.5px;
                font-weight: 600;
                padding: 3px 9px;
                border-radius: 100px;
                border: 1px solid var(--line);
                color: var(--muted);
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: var(--panel-alt);
            }
            .link-chip .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: currentColor;
                flex: none;
            }
            .link-chip.ok {
                color: var(--success);
                border-color: rgba(111, 207, 151, 0.35);
            }
            .link-chip.missing {
                color: var(--danger);
                border-color: rgba(209, 118, 109, 0.35);
            }
            .link-status-msg {
                width: 100%;
                font-size: 11.5px;
                margin-top: 2px;
            }
            .link-status-msg.ok {
                color: var(--success);
            }
            .link-status-msg.err {
                color: var(--danger);
            }

            .dropzone {
                border: 1.5px dashed var(--line);
                border-radius: 8px;
                padding: 22px 14px;
                text-align: center;
                cursor: pointer;
                color: var(--muted);
                font-size: 13px;
                transition:
                    border-color 0.15s ease,
                    background 0.15s ease;
            }
            .dropzone:hover,
            .dropzone.drag {
                border-color: var(--accent);
                background: rgba(240, 185, 63, 0.08);
            }
            .dropzone strong {
                color: var(--text);
                font-weight: 600;
            }
            .dropzone input {
                display: none;
            }

            .divider {
                height: 1px;
                background: var(--line);
                margin: 20px 0;
            }

            button {
                font-family: inherit;
                cursor: pointer;
                border: none;
                border-radius: 8px;
                padding: 11px 16px;
                font-size: 13.5px;
                font-weight: 600;
                letter-spacing: 0.01em;
            }
            .btn-primary {
                width: 100%;
                background: linear-gradient(
                    180deg,
                    var(--accent-bright),
                    var(--accent)
                );
                color: #241608;
            }
            .btn-primary:disabled {
                background: #3a3542;
                color: #8b8593;
                cursor: not-allowed;
            }
            .btn-primary:not(:disabled):hover {
                filter: brightness(1.06);
            }
            .btn-ghost {
                background: transparent;
                color: var(--muted);
                border: 1px solid var(--line);
            }
            .btn-ghost:hover {
                color: var(--text);
                border-color: var(--accent);
            }

            .zoom-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .zoom-row input[type="range"] {
                flex: 1;
                min-width: 0;
                accent-color: var(--accent);
            }
            .zoom-row .zoom-icon {
                color: var(--muted);
                font-size: 15px;
                width: 16px;
                text-align: center;
            }

            /* --- Cropper stage --- */
            .stage-panel {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }
            .ratio-badge {
                align-self: flex-start;
                font-size: 11px;
                letter-spacing: 0.1em;
                color: var(--accent-bright);
                border: 1px solid var(--line);
                padding: 4px 10px;
                border-radius: 100px;
                text-transform: uppercase;
            }
            .frame-outer {
                position: relative;
                width: 85%;
                max-width: 300px;
            }
            .crop-stage {
                position: relative;
                width: 100%;
                aspect-ratio: 320 / 504;
                background: #0a0c14;
                overflow: hidden;
                border-radius: 12px;
                touch-action: none;
                cursor: grab;
                user-select: none;
            }
            .crop-stage.grabbing {
                cursor: grabbing;
            }
            .crop-container {
                position: absolute;
                top: 10%;
                left: 10%;
                width: 80%;
                height: 80%;
                overflow: visible;
                pointer-events: none;
            }
            .crop-container img {
                position: absolute;
                top: 0;
                left: 0;
                transform-origin: 0 0;
                pointer-events: none;
                will-change: transform;
            }
            .crop-overlay {
                position: absolute;
                top: 10%;
                left: 10%;
                width: 80%;
                height: 80%;
                box-shadow: 0 0 0 9999px rgba(5, 8, 9, 0.74);
                border: 2px solid var(--accent);
                border-radius: 3px;
                pointer-events: none;
            }
            .empty-state {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                color: var(--muted);
                font-size: 12.5px;
                text-align: center;
                padding: 20px;
                z-index: 1;
            }
            .empty-state .glyph {
                font-size: 26px;
                color: var(--line);
            }

            .stage-controls {
                width: 85%;
                max-width: 300px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .stage-hint {
                font-size: 11.5px;
                color: var(--muted);
                text-align: center;
            }

            .log {
                width: 85%;
                max-width: 300px;
                background: var(--panel-alt);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 12px 14px;
                font-size: 12px;
                line-height: 1.7;
                color: var(--muted);
                max-height: 180px;
                overflow-y: auto;
                display: none;
            }
            .log.show {
                display: block;
            }
            .log .ok {
                color: var(--success);
            }
            .log .err {
                color: var(--danger);
            }
            .log .step::before {
                content: "› ";
                color: var(--accent);
            }

            /* --- Modal --- */
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(6, 7, 12, 0.7);
                backdrop-filter: blur(2px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                z-index: 9999;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.18s ease;
            }
            .modal-overlay.show {
                opacity: 1;
                pointer-events: auto;
            }
            .modal-box {
                position: relative;
                width: 100%;
                max-width: 360px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-top: 3px solid var(--accent);
                border-radius: 12px;
                padding: 26px 22px 20px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
                text-align: center;
                transform: translateY(10px) scale(0.98);
                transition: transform 0.18s ease;
            }
            .modal-overlay.show .modal-box {
                transform: translateY(0) scale(1);
            }
            .modal-box.success {
                border-top-color: var(--success);
            }
            .modal-box.error {
                border-top-color: var(--danger);
            }
            .modal-icon {
                width: 44px;
                height: 44px;
                margin: 0 auto 14px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                font-weight: 700;
            }
            .modal-box.success .modal-icon {
                background: rgba(111, 207, 151, 0.12);
                color: var(--success);
            }
            .modal-box.error .modal-icon {
                background: rgba(224, 87, 90, 0.12);
                color: var(--danger);
            }
            .modal-message {
                font-size: 13.5px;
                line-height: 1.6;
                color: var(--text);
                margin-bottom: 20px;
            }
            .modal-close-btn {
                background: linear-gradient(
                    180deg,
                    var(--accent-bright),
                    var(--accent)
                );
                color: #241608;
                border: none;
                border-radius: 8px;
                padding: 10px 24px;
                font-size: 13.5px;
                font-weight: 600;
                cursor: pointer;
            }
            .modal-close-btn:hover {
                filter: brightness(1.06);
            }
            .modal-close-x {
                position: absolute;
                top: 10px;
                right: 12px;
                background: none;
                border: none;
                color: var(--muted);
                font-size: 18px;
                line-height: 1;
                cursor: pointer;
                padding: 4px;
            }
            .modal-close-x:hover {
                color: var(--text);
            }

            .footnote {
                margin-top: 26px;
                font-size: 11.5px;
                color: var(--muted);
                text-align: center;
            }
            .footnote a {
                color: var(--white);
                text-decoration: none;
            }
            .footnote a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box" id="modalBox">
                <button class="modal-close-x" id="modalCloseX">×</button>
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-message" id="modalMessage"></div>
                <button class="modal-close-btn" id="modalCloseBtn">Đóng</button>
            </div>
        </div>
        <div class="wrap">
            <div class="grid">
                <!-- LEFT: inputs -->
                <div class="panel">
                    <div class="field">
                        <label for="playerUrl">Link Poster Nhân Vật</label>
                        <textarea
                            id="playerUrl"
                            rows="3"
                            placeholder="https://kgvn-camp.mobagarena.com/app/player-poster?..."
                        ></textarea>
                        <div class="link-status" id="linkStatus"></div>
                    </div>

                    <div class="field">
                        <label>Ảnh Poster Mới</label>
                        <div class="dropzone" id="dropzone">
                            <div>
                                <strong>Chọn ảnh</strong> hoặc kéo thả vào khung
                            </div>
                            <div style="margin-top: 4px; font-size: 11.5px">
                                Định dạng hỗ trợ: JPG · PNG · WEBP
                            </div>
                            <input
                                type="file"
                                id="fileInput"
                                accept="image/jpeg,image/png,image/webp"
                            />
                        </div>
                    </div>

                    <div class="divider"></div>

                    <button class="btn-primary" id="submitBtn" disabled>
                        Đổi Poster Ngay
                    </button>
                    <div style="height: 10px"></div>
                    <button class="btn-ghost" id="resetBtn" style="width: 100%">
                        Chọn Ảnh Khác
                    </button>
                </div>

                <!-- RIGHT: crop stage -->
                <div class="panel stage-panel">
                    <div class="ratio-badge">Xem Trước Poster</div>

                    <div class="frame-outer">
                        <div class="crop-stage" id="cropStage">
                            <div class="empty-state" id="emptyState">
                                <div class="glyph">✦</div>
                                <div>
                                    Poster của bạn sẽ hiện tại đây<br />kéo
                                    &amp; thu phóng để canh đúng khung
                                </div>
                            </div>
                            <div class="crop-container" id="cropContainer">
                                <img
                                    id="cropImg"
                                    style="display: none"
                                    alt=""
                                />
                            </div>
                            <div class="crop-overlay"></div>
                        </div>
                    </div>

                    <div class="stage-controls">
                        <div class="zoom-row">
                            <span class="zoom-icon">–</span>
                            <input
                                type="range"
                                id="zoomSlider"
                                min="1"
                                max="4"
                                step="0.01"
                                value="1"
                                disabled
                            />
                            <span class="zoom-icon">+</span>
                        </div>
                        <div class="stage-hint">
                            Kéo để di chuyển · trượt thanh để phóng to / nhỏ
                        </div>
                    </div>

                    <div class="log" id="log"></div>
                </div>
            </div>

            <div class="footnote">
                Made by
                <a
                    style="font-weight: 700"
                    target="_blank"
                    href="https://fb.com/honaki10"
                    >Honaki</a
                >
                with ♥
            </div>
        </div>

        <canvas
            id="hiddenCanvas"
            width="1080"
            height="1701"
            style="display: none"
        ></canvas>

        <script>
            (function () {
                const OUT_W = 1080,
                    OUT_H = 1701;

                const dropzone = document.getElementById("dropzone");
                const fileInput = document.getElementById("fileInput");
                const cropContainer = document.getElementById("cropContainer");
                const cropStage = document.getElementById("cropStage");
                const cropImg = document.getElementById("cropImg");
                const emptyState = document.getElementById("emptyState");
                const zoomSlider = document.getElementById("zoomSlider");
                const submitBtn = document.getElementById("submitBtn");
                const resetBtn = document.getElementById("resetBtn");
                const apiEndpoint = {
                    value: "https://api.honaki.site",
                };
                const playerUrl = document.getElementById("playerUrl");
                const linkStatusEl = document.getElementById("linkStatus");
                const logEl = document.getElementById("log");
                const modalOverlay = document.getElementById("modalOverlay");
                const modalBox = document.getElementById("modalBox");
                const modalIcon = document.getElementById("modalIcon");
                const modalMessage = document.getElementById("modalMessage");
                const modalCloseBtn = document.getElementById("modalCloseBtn");
                const modalCloseX = document.getElementById("modalCloseX");
                const hiddenCanvas = document.getElementById("hiddenCanvas");

                // 7 tham số bắt buộc để tạo globalHeaders phía worker
                const REQUIRED_PARAMS = [
                    { key: "partition", label: "partition" },
                    { key: "channelid", label: "channelid" },
                    { key: "gameid", label: "gameid" },
                    { key: "itopencodeparam", label: "itopencodeparam" },
                    { key: "os", label: "os" },
                    { key: "lang", label: "lang" },
                    { key: "aov_region", label: "aov_region" },
                ];

                // Cho phép người dùng dán nguyên cả đoạn text/lỗi trình duyệt,
                // tự tìm URL http(s) nằm bên trong.
                function extractUrlFromText(text) {
                    if (!text) return null;
                    const match = text.match(/https?:\/\/[^\s"'<>]+/);
                    return match ? match[0] : null;
                }

                function renderLinkStatus(rawValue) {
                    linkStatusEl.innerHTML = "";
                    const raw = (rawValue || "").trim();
                    if (!raw) return;

                    const url = extractUrlFromText(raw);
                    if (!url) {
                        const msg = document.createElement("div");
                        msg.className = "link-status-msg err";
                        msg.textContent =
                            "Không tìm thấy link hợp lệ trong nội dung đã dán.";
                        linkStatusEl.appendChild(msg);
                        return;
                    }

                    let parsed;
                    try {
                        parsed = new URL(url);
                    } catch {
                        const msg = document.createElement("div");
                        msg.className = "link-status-msg err";
                        msg.textContent = "Link không đúng định dạng URL.";
                        linkStatusEl.appendChild(msg);
                        return;
                    }

                    const params = parsed.searchParams;
                    let missing = 0;
                    REQUIRED_PARAMS.forEach(({ key, label }) => {
                        const has = !!params.get(key);
                        if (!has) missing++;
                        const chip = document.createElement("span");
                        chip.className =
                            "link-chip " + (has ? "ok" : "missing");
                        const dot = document.createElement("span");
                        dot.className = "dot";
                        chip.appendChild(dot);
                        chip.appendChild(document.createTextNode(label));
                        linkStatusEl.appendChild(chip);
                    });

                    const msg = document.createElement("div");
                    msg.className =
                        "link-status-msg " + (missing === 0 ? "ok" : "err");
                    msg.textContent =
                        missing === 0
                            ? "✓ Link hợp lệ."
                            : `⚠ Thiếu ${missing} tham số, link có thể không dùng được, hãy lấy lại link.`;
                    linkStatusEl.appendChild(msg);
                }

                playerUrl.addEventListener("input", () =>
                    renderLinkStatus(playerUrl.value),
                );
                playerUrl.addEventListener("paste", () => {
                    // đợi nội dung paste được chèn xong rồi mới xử lý
                    setTimeout(() => {
                        const extracted = extractUrlFromText(playerUrl.value);
                        if (extracted) playerUrl.value = extracted; // tự dọn, chỉ giữ lại link
                        renderLinkStatus(playerUrl.value);
                    }, 0);
                });

                function showModal(message, type = "error") {
                    modalBox.className = "modal-box " + type;
                    modalIcon.textContent = type === "success" ? "✓" : "!";
                    modalMessage.textContent = message;
                    modalOverlay.classList.add("show");
                }
                function closeModal() {
                    modalOverlay.classList.remove("show");
                }
                modalCloseBtn.addEventListener("click", closeModal);
                modalCloseX.addEventListener("click", closeModal);
                modalOverlay.addEventListener("click", (e) => {
                    if (e.target === modalOverlay) closeModal();
                });
                document.addEventListener("keydown", (e) => {
                    if (
                        e.key === "Escape" &&
                        modalOverlay.classList.contains("show")
                    ) {
                        closeModal();
                    }
                });
                let img = new Image();
                let naturalW = 0,
                    naturalH = 0;
                let baseScale = 1; // scale so image covers the container at zoom=1
                let scale = 1; // baseScale * zoomFactor
                let zoomFactor = 1;
                let tx = 0,
                    ty = 0; // top-left position of image within container (px)
                let containerW = 0,
                    containerH = 0;
                let dragging = false;
                let lastX = 0,
                    lastY = 0;
                let hasImage = false;
                let currentFileName = "image.jpg";

                function log(msg, cls) {
                    logEl.classList.add("show");
                    const div = document.createElement("div");
                    div.className = "step" + (cls ? " " + cls : "");
                    div.textContent = msg;
                    logEl.appendChild(div);
                    logEl.scrollTop = logEl.scrollHeight;
                }
                function clearLog() {
                    logEl.innerHTML = "";
                    logEl.classList.remove("show");
                }

                function measureContainer() {
                    const rect = cropContainer.getBoundingClientRect();
                    containerW = rect.width;
                    containerH = rect.height;
                }

                function clamp(v, min, max) {
                    return Math.min(max, Math.max(min, v));
                }

                function clampPosition() {
                    const dispW = naturalW * scale;
                    const dispH = naturalH * scale;
                    const minTx = containerW - dispW;
                    const minTy = containerH - dispH;
                    tx = clamp(tx, minTx, 0);
                    ty = clamp(ty, minTy, 0);
                }

                function applyTransform() {
                    cropImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
                }

                function loadImageFile(file) {
                    if (!file || !file.type.startsWith("image/")) return;
                    currentFileName = file.name || "image.jpg";
                    const url = URL.createObjectURL(file);
                    img = new Image();
                    img.onload = function () {
                        naturalW = img.naturalWidth;
                        naturalH = img.naturalHeight;
                        cropImg.src = url;
                        cropImg.style.width = naturalW + "px";
                        cropImg.style.height = naturalH + "px";
                        cropImg.style.display = "block";
                        emptyState.style.display = "none";

                        measureContainer();
                        baseScale = Math.max(
                            containerW / naturalW,
                            containerH / naturalH,
                        );
                        zoomFactor = 1;
                        scale = baseScale;
                        // center the image
                        tx = (containerW - naturalW * scale) / 2;
                        ty = (containerH - naturalH * scale) / 2;
                        clampPosition();
                        applyTransform();

                        zoomSlider.value = 1;
                        zoomSlider.disabled = false;
                        submitBtn.disabled = false;
                        hasImage = true;
                        clearLog();
                    };
                    img.src = url;
                }

                // --- file input / dropzone ---
                dropzone.addEventListener("click", () => fileInput.click());
                fileInput.addEventListener("change", (e) => {
                    if (e.target.files && e.target.files[0])
                        loadImageFile(e.target.files[0]);
                });
                ["dragenter", "dragover"].forEach((evt) => {
                    dropzone.addEventListener(evt, (e) => {
                        e.preventDefault();
                        dropzone.classList.add("drag");
                    });
                });
                ["dragleave", "drop"].forEach((evt) => {
                    dropzone.addEventListener(evt, (e) => {
                        e.preventDefault();
                        dropzone.classList.remove("drag");
                    });
                });
                dropzone.addEventListener("drop", (e) => {
                    if (e.dataTransfer.files && e.dataTransfer.files[0])
                        loadImageFile(e.dataTransfer.files[0]);
                });

                // --- zoom ---
                zoomSlider.addEventListener("input", () => {
                    if (!hasImage) return;
                    const cx = containerW / 2,
                        cy = containerH / 2;
                    // image-space point currently at container center, before zoom change
                    const imgX = (cx - tx) / scale;
                    const imgY = (cy - ty) / scale;

                    zoomFactor = parseFloat(zoomSlider.value);
                    scale = baseScale * zoomFactor;

                    // keep the same image point centered after zoom
                    tx = cx - imgX * scale;
                    ty = cy - imgY * scale;
                    clampPosition();
                    applyTransform();
                });

                // --- drag (mouse + touch) ---
                function startDrag(x, y) {
                    if (!hasImage) return;
                    dragging = true;
                    lastX = x;
                    lastY = y;
                    cropStage.classList.add("grabbing");
                }
                function moveDrag(x, y) {
                    if (!dragging) return;
                    tx += x - lastX;
                    ty += y - lastY;
                    lastX = x;
                    lastY = y;
                    clampPosition();
                    applyTransform();
                }
                function endDrag() {
                    dragging = false;
                    cropStage.classList.remove("grabbing");
                }

                cropStage.addEventListener("mousedown", (e) =>
                    startDrag(e.clientX, e.clientY),
                );
                window.addEventListener("mousemove", (e) =>
                    moveDrag(e.clientX, e.clientY),
                );
                window.addEventListener("mouseup", endDrag);

                cropStage.addEventListener(
                    "touchstart",
                    (e) => {
                        const t = e.touches[0];
                        startDrag(t.clientX, t.clientY);
                    },
                    { passive: true },
                );
                cropStage.addEventListener(
                    "touchmove",
                    (e) => {
                        const t = e.touches[0];
                        moveDrag(t.clientX, t.clientY);
                    },
                    { passive: true },
                );
                cropStage.addEventListener("touchend", endDrag);

                window.addEventListener("resize", () => {
                    if (!hasImage) return;
                    measureContainer();
                    baseScale = Math.max(
                        containerW / naturalW,
                        containerH / naturalH,
                    );
                    scale = baseScale * zoomFactor;
                    clampPosition();
                    applyTransform();
                });

                // --- reset ---
                resetBtn.addEventListener("click", () => {
                    hasImage = false;
                    cropImg.style.display = "none";
                    cropImg.src = "";
                    emptyState.style.display = "flex";
                    zoomSlider.value = 1;
                    zoomSlider.disabled = true;
                    submitBtn.disabled = true;
                    fileInput.value = "";
                    clearLog();
                });

                // --- produce final cropped blob at 320x504 ---
                function getCroppedBlob() {
                    return new Promise((resolve, reject) => {
                        const ctx = hiddenCanvas.getContext("2d");
                        ctx.clearRect(0, 0, OUT_W, OUT_H);

                        const sx = -tx / scale;
                        const sy = -ty / scale;
                        const sW = containerW / scale;
                        const sH = containerH / scale;

                        try {
                            ctx.drawImage(
                                img,
                                sx,
                                sy,
                                sW,
                                sH,
                                0,
                                0,
                                OUT_W,
                                OUT_H,
                            );
                        } catch (e) {
                            reject(e);
                            return;
                        }
                        hiddenCanvas.toBlob(
                            (blob) => {
                                if (blob) resolve(blob);
                                else
                                    reject(
                                        new Error("Không tạo được ảnh crop"),
                                    );
                            },
                            "image/png",
                            0.95,
                        );
                    });
                }

                // --- submit ---
                submitBtn.addEventListener("click", async () => {
                    clearLog();
                    const endpoint = apiEndpoint.value.trim();
                    const purl = extractUrlFromText(playerUrl.value);

                    if (!endpoint) {
                        log("Thiếu Worker API endpoint.", "err");
                        return;
                    }
                    if (!purl) {
                        log("Thiếu Player image URL.", "err");
                        showModal(
                            "Không tìm thấy link hợp lệ - dán lại link từ trình duyệt.",
                            "error",
                        );
                        return;
                    }
                    try {
                        const parsed = new URL(purl);
                        const missing = REQUIRED_PARAMS.filter(
                            ({ key }) => !parsed.searchParams.get(key),
                        );
                        if (missing.length > 0) {
                            showModal(
                                `Link thiếu ${missing.length} tham số (${missing
                                    .map((m) => m.label)
                                    .join(", ")}) - poster có thể lỗi.`,
                                "error",
                            );
                        }
                    } catch {
                        log("Link không đúng định dạng URL.", "err");
                        showModal("Link không đúng định dạng URL.", "error");
                        return;
                    }
                    if (!hasImage) {
                        log("Chưa chọn ảnh.", "err");
                        return;
                    }

                    submitBtn.disabled = true;
                    submitBtn.textContent = "Đang xử lý...";

                    try {
                        log("Đang cắt ảnh theo khung 1080x1701");
                        const blob = await getCroppedBlob();
                        log("Đang đổi poster");

                        const form = new FormData();
                        form.append("url", purl);
                        form.append(
                            "image",
                            blob,
                            currentFileName.replace(/\.[^.]+$/, "") +
                                "_cropped.png",
                        );

                        const resp = await fetch(endpoint, {
                            method: "POST",
                            body: form,
                        });
                        const data = await resp.json().catch(() => ({}));

                        // if (Array.isArray(data.steps)) {
                        //     data.steps.forEach((s) => log(s));
                        // }

                        if (data.ok) {
                            log(
                                "Hoàn tất. PosterID: " + (data.posterId || "-"),
                                "ok",
                            );
                            showModal("Đổi ảnh poster thành công!", "success");
                        } else {
                            const errMsg = data.error || "";
                            const resultBlob = (
                                JSON.stringify(data.result || "") +
                                " " +
                                JSON.stringify(data.details || "")
                            ).toLowerCase();

                            if (
                                resp.status === 403 &&
                                /createposter/i.test(errMsg)
                            ) {
                                log("Lỗi: Link không hợp lệ (403).", "err");
                                showModal(
                                    "Link đã sai hoặc hết hạn - vui lòng lấy link mới.",
                                    "error",
                                );
                            } else if (
                                /pic\s*invalid/i.test(errMsg) ||
                                resultBlob.includes("pic invalid")
                            ) {
                                log(
                                    "Lỗi: Ảnh bị đánh dấu không hợp lệ.",
                                    "err",
                                );
                                showModal(
                                    "Ảnh có thể chứa nội dung nhạy cảm - vui lòng đổi ảnh khác.",
                                    "error",
                                );
                            } else {
                                log(
                                    "Lỗi: " + (errMsg || "HTTP " + resp.status),
                                    "err",
                                );
                                showModal(
                                    errMsg ||
                                        "Đã xảy ra lỗi, vui lòng thử lại.",
                                    "error",
                                );
                            }
                        }
                    } catch (err) {
                        log("Lỗi: " + err.message, "err");
                        showModal(
                            "Không thể kết nối tới máy chủ - thử lại sau.",
                            "error",
                        );
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Đổi Poster Ngay";
                    }
                });
            })();
        </script>
    </body>
</html>
