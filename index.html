<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Cache-Control"
            content="no-cache, no-store, must-revalidate"
        />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>Đổi ảnh load trận LQM</title>

        <!-- Start: Favicon -->
        <link rel="icon" href="assets/imgs/favicon.ico" type="image/x-icon" />
        <link rel="apple-touch-icon" href="assets/imgs/favicon.ico" />
        <!-- End: Favicon -->

        <meta
            name="description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />

        <!-- Start: Open Graph -->
        <meta property="og:title" content="Đổi ảnh load trận LQM" />
        <meta
            property="og:description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />
        <meta
            property="og:image"
            content="https://aov.honaki.site/assets/imgs/preview.jpg"
        />
        <meta
            property="og:image:secure_url"
            content="https://aov.honaki.site/assets/imgs/preview.jpg"
        />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Đổi ảnh load trận Liên Quân Mobile"
        />
        <meta property="og:url" content="https://aov.honaki.site/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Honaki Poster Studio" />
        <meta property="og:locale" content="vi_VN" />
        <!-- End: Open Graph -->

        <!-- Start: Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Đổi ảnh load trận LQM" />
        <meta
            name="twitter:description"
            content="Công cụ đổi ảnh loading trận Liên Quân Mobile."
        />
        <meta
            name="twitter:image"
            content="https://aov.honaki.site/assets/imgs/preview.jpg"
        />
        <!-- End: Twitter Card -->

        <meta name="theme-color" content="#005b96" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body>
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box" id="modalBox">
                <button class="modal-close-x" id="modalCloseX">×</button>
                <div class="modal-icon" id="modalIcon"></div>
                <img class="modal-preview-img" id="modalPreviewImg" alt="" />
                <div class="modal-message" id="modalMessage"></div>
                <button class="modal-close-btn" id="modalCloseBtn">Đóng</button>
            </div>
        </div>
        <div class="wrap">
            <div class="grid">
                <div class="panel">
                    <div class="field">
                        <label>Xác Thực Tài Khoản</label>
                        <div class="share-options">
                            <button
                                type="button"
                                class="share-option active"
                                id="modeLinkBtn"
                            >
                                <span class="share-option-title"
                                    >Link CAMP</span
                                >
                            </button>
                            <button
                                type="button"
                                class="share-option"
                                id="modeHarBtn"
                            >
                                <span class="share-option-title">File HAR</span>
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <div id="linkModeWrap">
                            <div class="field-label-row">
                                <label for="playerUrl">Link Poster</label>
                                <button
                                    type="button"
                                    class="paste-btn"
                                    id="pasteBtn"
                                >
                                    Dán
                                </button>
                            </div>
                            <textarea
                                id="playerUrl"
                                rows="3"
                                placeholder="https://kgvn-camp.mobagarena.com/app/player-poster?..."
                            ></textarea>
                        </div>

                        <div id="harModeWrap" class="hidden">
                            <label for="harFileInput">File HAR</label>
                            <div class="dropzone" id="harDropzone">
                                <div id="harDropzoneEmpty">
                                    <div>
                                        <strong>Chọn file .har</strong> hoặc kéo
                                        thả vào khung
                                    </div>
                                </div>
                                <div id="harDropzoneSelected" class="hidden">
                                    <strong id="harDropzoneText"></strong>
                                    <div
                                        style="
                                            margin-top: 4px;
                                            font-size: 11.5px;
                                        "
                                    >
                                        Bấm hoặc kéo thả để chọn file khác
                                    </div>
                                </div>
                                <input
                                    type="file"
                                    id="harFileInput"
                                    accept=".har,application/json"
                                />
                            </div>
                            <div id="harStatus" class="har-status"></div>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div
                        style="display: flex; gap: 10px; flex-direction: column"
                    >
                        <button
                            class="btn-ghost"
                            id="copyInjectBtn"
                            style="width: 100%; font-size: 12px"
                        >
                            Copy Code Inject
                        </button>
                        <button class="btn-primary" id="goToGameBtn">
                            Chuyển tới trang game
                        </button>
                    </div>
                </div>
            </div>

            <div class="footnote">
                Made by
                <a
                    style="font-weight: 700"
                    target="_blank"
                    href="https://fb.com/honaki10"
                    >Honaki</a
                >
                with <span style="color: red">♥</span>
            </div>
        </div>

        <script src="assets/js/app.js"></script>
    </body>
</html>
